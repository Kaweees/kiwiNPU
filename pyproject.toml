[project]
name = "kiwi-npu"
version = "0.1.0"
description = "Add your description here"
authors = [{ name = "Miguel Villa Floran", email = "miguel.villafloran@gmail.com" }]
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { file = "LICENSE" }

dependencies = [
  "cocotb>=2.0.1",
  "cocotb-bus>=0.2.1",
  "pydantic>=2.12.5",
  "pytest>=9.0.2",
  "torch>=2.11.0",
  "torchao>=0.14.1",
  "torchaudio>=2.11.0",
  "torchvision>=0.24.1",
  "tqdm>=4.67.1",
  "typer>=0.20.0",
]

[dependency-groups]
dev = ["ipykernel", "ipywidgets", "pre-commit"]

[tool.uv]
index-strategy = "unsafe-best-match"
prerelease = "allow"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
